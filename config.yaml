# Covered only by the Simplify feed (career sites are login-walled or JS-only):
#   Goldman Sachs (higher.gs.com) · Morgan Stanley · Deloitte · EY · KPMG
#   McKinsey · Bain · BCG · Evercore · Lazard · Jefferies · UBS · Deutsche Bank

# ─────────────────────────────────────────────────────────────
#  Discord
# ─────────────────────────────────────────────────────────────
discord:
  # Webhook URLs come from GitHub secrets (DISCORD_WEBHOOK, DISCORD_TOP_WEBHOOK)
  # so they never live in this file.
  username: "AKPsi Intern Radar"
  # Mention for Tier-1 drops. Use "@here", "@everyone", or a role like <@&ROLE_ID>. Leave blank for none.
  tier1_mention: "@here"
  # Max new postings to announce on the very first run (avoids a 300-message flood).
  first_run_max_posts: 25
  # Weekly digest (sent by the `digest` job on Mondays) – Tier 1 listed first.
  digest_lookback_days: 7
  digest_max_per_tier: 40
  # Put a dedicated "🔥 posted in the last N days" section at the top of the digest.
  digest_fresh_section: true

# Drop postings from `seen.json` after this many days so the file stays small.
seen_retention_days: 200
