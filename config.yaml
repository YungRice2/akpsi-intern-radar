    search_text: intern
    sites:
      - {name: JP Morgan Chase, host: "https://jpmc.fa.oraclecloud.com",     site_number: CX_1001}
      - {name: BNY,             host: "https://eofe.fa.us2.oraclecloud.com", site_number: CX_1001}
