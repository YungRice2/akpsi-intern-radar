# ─────────────────────────────────────────────────────────────
#  AKPsi Intern Radar – configuration
#  Edit this file; no code changes needed for most tweaks.
# ─────────────────────────────────────────────────────────────

# Which recruiting seasons to let through. Anything else is dropped.
allowed_terms:
  - "Summer 2027"
  - "Spring 2027"
  - "Fall 2026"
  - "Winter 2027"
  - "N/A"          # Simplify marks some roles with no term; keep them

# Cycle filter applied to posting titles. A title with no year and no season
# passes unconditionally — most postings omit them.
cycles:
  years_ahead: [1, 2]     # accepted = base_year + these offsets
  rollover_month: 7       # base_year advances once month >= this; before it, base = year - 1
  allowed_seasons: [summer]
  # Override: set allowed_years: [2027, 2028] to pin specific years instead.

# A posting passes the screener if its title matches ANY include keyword
# and NO exclude keyword. Case-insensitive, matched as whole words/phrases.
include_keywords:
  - finance
  - financial
  - accounting
  - accountant
  - audit
  - tax
  - treasury
  - "investment banking"
  - "wealth management"
  - "asset management"
  - "private wealth"
  - "financial advisor"
  - "wealth advisor"
  - "summer analyst"
  - "sales and trading"
  - "capital markets"
  - "private equity"
  - "corporate banking"
  - "commercial banking"
  - consulting
  - consultant
  - advisory
  - strategy
  - management
  - "human resources"
  - "\\bHR\\b"
  - "people operations"
  - talent
  - recruiting
  - sales
  - "business development"
  - marketing
  - "brand"
  - operations
  - "risk"
  - "compliance"
  - "actuar"

exclude_keywords:
  - engineer
  - engineering
  - software
  - developer
  - "data scien"
  - "machine learning"
  - "\\bML\\b"
  - "\\bAI\\b"
  - quant
  - "product manag"
  - "product management"
  - "\\bPhD\\b"
  - "hardware"
  - "cyber"
  - "security engineer"
  - "computer vision"
  - "\\bMBA\\b"        # remove this line if you want MBA-level roles too
  - "experienced"
  - "senior"
  - "technolog"
  - "applied scien"
  - "meteorolog"
  - "data manag"
  - "data govern"
  - "data enablement"

# Extra words that must appear somewhere in the title for a posting to count
# as an internship (guards against full-time roles leaking in).
internship_markers:
  - intern
  - internship
  - "summer analyst"
  - "co-op"
  - "coop"
  - "campus"
  - "early careers"

# ─────────────────────────────────────────────────────────────
#  Company tiers  →  Tier 1 = "biggest companies", pinned to top
# ─────────────────────────────────────────────────────────────
# Matching is case-insensitive substring on the company name.
tiers:
  tier1:
    - JP Morgan
    - JPMorgan
    - Goldman Sachs
    - Morgan Stanley
    - BNY
    - Bank of New York
    - Schwab
    - Citi
    - Bank of America
    - Wells Fargo
    - Deloitte
    - PwC
    - PricewaterhouseCoopers
    - KPMG
    - "EY"
    - Ernst & Young
    - McKinsey
    - Bain
    - Boston Consulting
    - "BCG"
    - BlackRock
    - Fidelity
    - Vanguard
    - American Express
    - Capital One
    - Blackstone
    - "KKR"
    - Evercore
    - Lazard
    - Jefferies
    - "UBS"
    - Barclays
    - Deutsche Bank
    - Raymond James
    - Northwestern Mutual
    - Accenture
  # Everything not in tier1 is tier2 automatically.

# Optional: skip companies entirely (e.g. universities posting student jobs)
blocked_companies:
  - University of
  - College of

# ─────────────────────────────────────────────────────────────
#  Recency
# ─────────────────────────────────────────────────────────────
recency:
  # Drop anything older than this many days. Set to 0 to disable the filter.
  # (Postings whose source doesn't publish a date are always kept.)
  max_age_days: 45
  # Within each tier, sort newest first. Turn off to sort alphabetically.
  sort_newest_first: true
  # Add a 🔥 and a louder header when a posting is under this many days old.
  fresh_days: 3

# Max postings to announce per company per scan. Overflow is NOT marked seen,
# so it resurfaces on the next run. Set to 0 to disable.
max_per_company_per_scan: 5

# ─────────────────────────────────────────────────────────────
#  Sources
#  Every URL below was verified against a live job posting.
# ─────────────────────────────────────────────────────────────
sources:
  # 1) Simplify community feed — the safety net. Covers thousands of employers,
  #    including ones with locked-down career sites (Goldman, Deloitte, EY, KPMG).
  simplify:
    enabled: true
    urls:
      - https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/dev/.github/scripts/listings.json

  # 2) Workday — the most common platform. Queried live, so you see postings
  #    within 30 min of them going up.
  workday:
    enabled: true
    search_text: intern
    max_per_site: 200
    sites:
      - {name: Citi,                  careers_url: "https://citi.wd5.myworkdayjobs.com/2"}
