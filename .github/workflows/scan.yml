name: Intern Radar

on:
  schedule:
    - cron: "*/30 * * * *"     # scan every 30 minutes
    - cron: "0 13 * * 1"       # Monday 9:00 AM ET — weekly pinned board
    - cron: "0 14 1 * *"       # 1st of the month — source health report
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        required: true
        default: scan
        type: choice
        options: [scan, digest, health, dry-run]

permissions:
  contents: write

concurrency:
  group: intern-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick mode
        id: m
        run: |
          case "${{ github.event.schedule }}" in
            "0 13 * * 1") echo "mode=digest" >> $GITHUB_OUTPUT ;;
            "0 14 1 * *") echo "mode=health" >> $GITHUB_OUTPUT ;;
            "*/30 * * * *") echo "mode=scan"  >> $GITHUB_OUTPUT ;;
            *) echo "mode=${{ inputs.mode || 'scan' }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Run (${{ steps.m.outputs.mode }})
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_TOP_WEBHOOK: ${{ secrets.DISCORD_TOP_WEBHOOK }}
        run: python -m radar.main ${{ steps.m.outputs.mode }}

      - name: Save state
        if: steps.m.outputs.mode == 'scan'
        run: |
          git config user.name "intern-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet && exit 0
          git commit -m "update seen postings [skip ci]"
          git pull --rebase --autostash
          git push
